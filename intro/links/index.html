  return { g: String(x.g || "기타").trim().slice(0, 30) || "기타", t: String(x.t || u).trim().slice(0, 80) || u, u: u.slice(0, 600), n: String(x.n || "").trim().slice(0, 120) };
}
function fromJson(s) { try { var a = JSON.parse(s); return Array.isArray(a) ? a.map(clean).filter(Boolean) : null; } catch (e) { return null; } }
function defaults() { return DEFAULTS.map(function (d) { return { g: d[0], t: d[1], u: d[2], n: d[3] }; }); }
function pack(a) { return JSON.stringify(a.map(function (x) { return { g: x.g, t: x.t, u: x.u, n: x.n }; })); }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
function plat(u) {   // 글자+모양으로 구분(색에만 기대지 않아요)
  var h = host(u);
  if (/youtube\.com$|youtu\.be$/.test(h)) return "▶ 유튜브";
  if (/instagram\.com$/.test(h)) return "◎ 인스타그램";
  if (/tiktok\.com$/.test(h)) return "♪ 틱톡";
  if (/threads\.(com|net)$/.test(h)) return "@ 쓰레드";
  if (/^cafe\.naver\.com$/.test(h)) return "☕ 카페";
  if (/^blog\.naver\.com$/.test(h)) return "✎ 블로그";
  if (/^map\.naver\.com$/.test(h)) return "📍 네이버 지도";
  if (/^open\.kakao\.com$/.test(h)) return "💬 오픈채팅";
  if (/kakao\.com$/.test(h)) return "💬 카카오톡";
  if (/spacecloud\.kr$/.test(h)) return "🏠 스페이스클라우드";
  if (/ksinvaid\.github\.io$/.test(h)) return "🎮 게임·소개";
  if (/roundb\.co\.kr$/.test(h)) return "🏢 홈페이지";
  return "🔗 링크";
}
function el(tag, attrs, kids) {
  var e = document.createElement(tag), k;
  for (k in (attrs || {})) { if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}
function toast(m) { var t = $("toast"); t.textContent = m; t.className = "toast on"; clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = "toast"; }, 2600); }
function copy(text, okMsg) {
  var done = function () { toast(okMsg || "복사했어요"); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
  function fallback() {
    var ta = el("textarea", { "aria-hidden": "true" }); ta.value = text; ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy") ? done() : toast("복사하지 못했어요. 길게 눌러 직접 복사해 주세요"); } catch (e) { toast("복사하지 못했어요"); }
    document.body.removeChild(ta);
  }
}

/* ---------- 그리기 ---------- */
function groups() { var o = []; items.forEach(function (x) { if (o.indexOf(x.g) < 0) o.push(x.g); }); return o; }
function matches(x) {
  if (tab && x.g !== tab) return false;
  if (!q) return true;
  return (x.t + " " + x.n + " " + x.g + " " + plat(x.u) + " " + host(x.u)).toLowerCase().indexOf(q) >= 0;
}
function drawTabs() {
  var box = $("tabs"); box.textContent = "";
  var all = [""].concat(groups());
  if (all.length < 3) return;
  all.forEach(function (g) {
    var b = el("button", { type: "button", "class": "chip", "aria-pressed": String(tab === g), text: g || "전체" });
    b.onclick = function () { tab = g; draw(); };
    box.appendChild(b);
  });
}
function card(x, i) {
  var go = el("a", { "class": "go", href: x.u, target: "_blank", rel: "noopener noreferrer" }, [
    el("span", { "class": "pf", text: plat(x.u) }),
    el("span", { "class": "tt", text: x.t }),
    x.n ? el("span", { "class": "nt", text: x.n }) : null,
    el("span", { "class": "hs", text: host(x.u) })
  ]);
  var cp = el("button", { type: "button", "aria-label": "주소 복사 — " + x.t, text: "복사" });
  cp.onclick = function () { copy(x.u, "주소를 복사했어요"); };
  var li = el("li", { "class": "cd" }, [el("div", { "class": "main" }, [go, el("div", { "class": "side" }, [cp])])]);
  if (admin) {
    var mk = function (label, fn, dis) { var b = el("button", { type: "button", text: label }); if (dis) b.disabled = true; b.onclick = fn; return b; };
    var sg = sameGroup(i);
    li.appendChild(el("div", { "class": "ed" }, [
      mk("수정", function () { openForm(i); }),
      mk("▲", function () { move(i, -1); }, sg.prev < 0),
      mk("▼", function () { move(i, 1); }, sg.next < 0),
      mk("삭제", function () { if (confirm("이 링크를 지울까요?\n" + x.t)) { items.splice(i, 1); touch(); } })
    ]));
  }
  return li;
}
function draw() {
  var gs = groups();
  if (tab && gs.indexOf(tab) < 0) tab = "";
  drawTabs();
  var list = $("list"); list.textContent = ""; var shown = 0;
  gs.forEach(function (g, gi) {
    var idx = []; items.forEach(function (x, i) { if (x.g === g && matches(x)) idx.push(i); });
    if (!idx.length) return;
    shown += idx.length;
    var acts = el("div", { "class": "acts" });
    var cpAll = el("button", { type: "button", "class": "btn sm", text: "주소 전체 복사" });
    cpAll.onclick = function () { copy(idx.map(function (i) { return items[i].u; }).join("\n"), idx.length + "개 주소를 복사했어요"); };
    acts.appendChild(cpAll);
    if (admin) {
      var rn = el("button", { type: "button", "class": "btn sm", text: "이름 바꾸기" });
      rn.onclick = function () { var v = prompt("분류 이름", g); if (v === null) return; v = v.trim().slice(0, 30); if (!v) return; items.forEach(function (x) { if (x.g === g) x.g = v; }); touch(); };
      var up = el("button", { type: "button", "class": "btn sm", text: "분류 ▲" }), dn = el("button", { type: "button", "class": "btn sm", text: "분류 ▼" });
      if (gi === 0) up.disabled = true; if (gi === gs.length - 1) dn.disabled = true;
      up.onclick = function () { moveGroup(gi, -1); }; dn.onclick = function () { moveGroup(gi, 1); };
      acts.appendChild(rn); acts.appendChild(up); acts.appendChild(dn);
    }
    var ul = el("ul", { "class": "lk" });
    idx.forEach(function (i) { ul.appendChild(card(items[i], i)); });
    list.appendChild(el("section", { "class": "grp", "aria-label": g }, [el("div", { "class": "gh" }, [el("h2", { text: g }), el("span", { "class": "n", text: idx.length + "개" }), acts]), ul]));
  });
  $("empty").hidden = shown > 0;
  if (admin) { $("st").textContent = dirty ? "저장하지 않은 변경이 있어요" : "변경 없음 · 모든 링크가 저장돼 있어요"; $("b-save").disabled = !dirty; }
  $("gl").textContent = ""; groups().forEach(function (g) { $("gl").appendChild(el("option", { value: g })); });
}
function touch() { dirty = pack(items) !== base; draw(); }

/* ---------- 순서 ---------- */
function sameGroup(i) {
  var g = items[i].g, p = -1, n = -1, j;
  for (j = i - 1; j >= 0; j--) if (items[j].g === g) { p = j; break; }
  for (j = i + 1; j < items.length; j++) if (items[j].g === g) { n = j; break; }
  return { prev: p, next: n };
}
function move(i, d) { var s = sameGroup(i), j = d < 0 ? s.prev : s.next; if (j < 0) return; var t = items[i]; items[i] = items[j]; items[j] = t; touch(); }
function moveGroup(gi, d) {
  var gs = groups(), j = gi + d; if (j < 0 || j >= gs.length) return;
  var t = gs[gi]; gs[gi] = gs[j]; gs[j] = t;
  var out = []; gs.forEach(function (g) { items.forEach(function (x) { if (x.g === g) out.push(x); }); }); items = out; touch();
}

/* ---------- 불러오기 ---------- */
function net(url, opt, ms) {
  var c = new AbortController(), tm = setTimeout(function () { c.abort(); }, ms || 12000); opt = opt || {}; opt.signal = c.signal;
  return fetch(url, opt).then(function (r) { return r.json().catch(function () { return null; }).then(function (j) { return { s: r.status, j: j }; }); }).then(function (v) { clearTimeout(tm); return v; }, function (e) { clearTimeout(tm); throw e; });
}
function readCache() { try { return fromJson(localStorage.getItem(CK) || ""); } catch (e) { return null; } }
function writeCache(a) { try { localStorage.setItem(CK, pack(a)); } catch (e) {} }
function fetchList() {
  return net(DOC + "?key=" + KEY).then(function (r) {
    if (r.s === 200 && r.j && r.j.fields && r.j.fields.items && r.j.fields.items.stringValue != null) { var a = fromJson(r.j.fields.items.stringValue); return a ? { ok: true, a: a } : { ok: false }; }
    return { ok: false, none: r.s === 404 };
  }).catch(function () { return { ok: false }; });
}
function load() {
  items = readCache() || defaults(); base = pack(items); draw();
  fetchList().then(function (r) { if (dirty) return; if (r.ok) { items = r.a; writeCache(r.a); base = pack(items); draw(); } else if (r.none) { items = defaults(); base = pack(items); draw(); } });
}

/* ---------- 관리자: 구글 로그인(누를 때만 로그인 도구를 불러와요) → 운영자인지 서버가 확인 ---------- */
var INAPP = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|Instagram|DaumApps|; wv\)|Line\//i.test(navigator.userAgent || "");
function sdk() {
  if (fb) return Promise.resolve(fb);
  return Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js")]).then(function (m) {
    var app = m[0].getApps().length ? m[0].getApp() : m[0].initializeApp({ apiKey: KEY, authDomain: PID + ".firebaseapp.com", projectId: PID });
    var auth = m[1].getAuth(app); auth.languageCode = "ko"; fb = { u: m[1], auth: auth }; return fb;
  });
}
function whenUser(f) { return new Promise(function (res) { var off = f.u.onAuthStateChanged(f.auth, function (u) { off(); res(u); }); }); }
function isMaster(user) {   // 서버 규칙이 이 계정을 운영자로 보면 200/404, 아니면 403
  return user.getIdToken().then(function (tok) { return net(PING, { headers: { Authorization: "Bearer " + tok } }); }).then(function (r) { return r.s === 200 || r.s === 404; });
}
function enter() {
  if (INAPP) { toast("카카오톡 같은 앱 안 브라우저에서는 구글 로그인이 막혀요. 크롬·사파리로 열어 주세요"); return; }
  var b = $("adm"); b.disabled = true; b.textContent = "로그인 확인 중…";
  sdk().then(function (f) {
    return whenUser(f).then(function (u) {
      if (u) return u;
      var p = new f.u.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
      return f.u.signInWithPopup(f.auth, p).then(function (r) { return r.user; });
    }).then(function (u) {
      return isMaster(u).then(function (ok) {
        if (ok) { admin = true; $("bar").className = "bar on"; toast("관리자 모드를 켰어요"); draw(); }
        else { toast("관리자 계정이 아니에요"); return f.u.signOut(f.auth); }
      });
    });
  }).catch(function (e) {
    var c = e && e.code;
    toast(c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request" ? "로그인 창을 닫았어요" : c === "auth/popup-blocked" ? "팝업이 막혀 있어요. 팝업을 허용하고 다시 눌러 주세요" : c === "auth/unauthorized-domain" ? "이 주소에서는 구글 로그인을 쓸 수 없어요" : "로그인하지 못했어요. 잠시 뒤 다시 눌러 주세요");
  }).then(function () { b.disabled = false; b.textContent = "관리자"; });
}
function leave() {
  var go = function () { admin = false; $("bar").className = "bar"; draw(); toast("관리자 모드를 껐어요"); };
  if (dirty && !confirm("저장하지 않은 변경이 사라져요. 로그아웃할까요?")) return;
  if (dirty) { items = readCache() || defaults(); dirty = false; base = pack(items); }
  if (fb) fb.u.signOut(fb.auth).then(go, go); else go();
}
function save() {
  var b = $("b-save"); b.disabled = true; b.textContent = "저장 중…";
  var body = JSON.stringify({ fields: { items: { stringValue: pack(items) }, updated: { integerValue: String(Date.now()) } } });
  fb.auth.currentUser.getIdToken().then(function (tok) {
    return net(DOC + "?updateMask.fieldPaths=items&updateMask.fieldPaths=updated", { method: "PATCH", headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: body });
  }).then(function (r) {
    if (r.s === 200) { base = pack(items); dirty = false; writeCache(items); toast("저장했어요. 이제 모두에게 이 목록이 보여요"); }
    else if (r.s === 403) toast("저장이 거절됐어요. 서버 규칙에 링크모음이 아직 게시되지 않았을 수 있어요");
    else toast("저장하지 못했어요 (" + r.s + "). 잠시 뒤 다시 눌러 주세요");
  }).catch(function () { toast("인터넷 연결을 확인하고 다시 눌러 주세요"); }).then(function () { b.textContent = "저장하기"; draw(); });
}
function undo() {
  if (dirty && !confirm("저장하지 않은 변경을 버리고 마지막 저장본으로 되돌릴까요?")) return;
  fetchList().then(function (r) { items = r.ok ? r.a : (readCache() || defaults()); base = pack(items); dirty = false; draw(); toast("마지막 저장본으로 되돌렸어요"); });
}

/* ---------- 추가·수정 창 ---------- */
function openForm(i) {
  editIdx = i; var x = i >= 0 ? items[i] : { t: "", u: "", g: tab || (groups()[0] || ""), n: "" };
  $("mh").textContent = i >= 0 ? "링크 수정" : "링크 추가";
  $("f-t").value = x.t; $("f-u").value = x.u; $("f-g").value = x.g; $("f-n").value = x.n; $("f-e").hidden = true;
  $("ov").className = "ov on"; $("f-t").focus();
}
function closeForm() { $("ov").className = "ov"; }
function submitForm() {
  var t = $("f-t").value.trim(), u = $("f-u").value.trim(), g = $("f-g").value.trim(), n = $("f-n").value.trim(), e = $("f-e");
  var bad = function (m) { e.textContent = m; e.hidden = false; };
  if (u && !/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u;
  if (!/^https?:\/\/[^\s]+$/i.test(u)) return bad("주소를 https:// 로 시작하는 올바른 주소로 넣어 주세요");
  try { new URL(u); } catch (err) { return bad("주소 형식이 올바르지 않아요"); }
  if (!t) t = host(u) || u;
  if (!g) g = "기타";
  var x = clean({ g: g, t: t, u: u, n: n });
  if (editIdx >= 0) { var old = items[editIdx]; items[editIdx] = x; if (old.g !== x.g) { items.splice(editIdx, 1); var last = -1; items.forEach(function (y, k) { if (y.g === x.g) last = k; }); items.splice(last + 1, 0, x); } }
  else { var l2 = -1; items.forEach(function (y, k) { if (y.g === x.g) l2 = k; }); if (l2 < 0) items.push(x); else items.splice(l2 + 1, 0, x); }
  closeForm(); touch();
}

/* ---------- 연결 ---------- */
$("find").addEventListener("input", function () { q = this.value.trim().toLowerCase(); draw(); });
$("adm").onclick = enter; $("b-add").onclick = function () { openForm(-1); }; $("b-save").onclick = save; $("b-undo").onclick = undo; $("b-out").onclick = leave;
$("f-x").onclick = closeForm; $("f-ok").onclick = submitForm;
$("ov").addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeForm(); if (ev.key === "Enter" && ev.target.tagName === "INPUT") { ev.preventDefault(); submitForm(); } });
window.addEventListener("beforeunload", function (ev) { if (admin && dirty) { ev.preventDefault(); ev.returnValue = ""; } });
load();
})();
</script>
